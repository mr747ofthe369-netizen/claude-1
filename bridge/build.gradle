plugins {
    id 'com.android.application'
}

android {
    namespace 'com.memetaillab.beta1'
    compileSdk 35

    defaultConfig {
        applicationId 'com.memetaillab.parameterbridge'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
